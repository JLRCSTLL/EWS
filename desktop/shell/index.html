<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGILA Command Center</title><link rel="stylesheet" href="/shell.css"></head>
<body>
  <header class="toolbar" aria-label="Desktop controls">
    <button class="connection" id="connection" data-command="connection" title="Check the shared service"><i></i><span>Connecting</span></button>
    <div class="actions">
      <span id="awake" hidden>Display awake</span>
      <button class="icon-button" data-command="reload" title="Reload command center (Ctrl+R)" aria-label="Reload command center"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2.4 5.7"/></svg></button>
      <button class="icon-button" id="fullscreen" data-command="fullscreen" title="Full screen (F11)" aria-label="Enter full screen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
      <button class="icon-button" data-command="about" title="About and keyboard shortcuts" aria-label="About AGILA Command Center"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.5"/></svg></button>
    </div>
  </header>
  <main id="splash" aria-busy="true">
    <div class="radar-grid" aria-hidden="true"></div>
    <section class="startup">
      <div class="eyebrow"><span></span> COMMAND CENTER</div>
      <img class="platform-mark" src="/logo.png" alt="" /><div class="platform-name">AGILA</div>
      <p class="tagline">Advanced Geospatial Intelligence<br />for Life Safety and Alerts</p>
      <div class="loading-line" id="loading-line" aria-hidden="true"><span></span></div>
      <div role="status" aria-live="polite"><h1 id="status-title">Preparing your workspace</h1><p id="status-detail">Opening your command center…</p></div>
      <button class="retry" id="retry" data-command="retry" hidden>Reconnect to command center <span aria-hidden="true">↗</span></button>
      <p id="retry-note" hidden>We’ll also retry automatically. No messages are sent while disconnected.</p>
    </section>
    <footer><span>COMMAND CENTER <b>WINDOWS</b></span><span id="version"></span></footer>
  </main>
  <script src="/shell.js"></script>
</body></html>
