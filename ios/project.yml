name: AGILA
options:
  bundleIdPrefix: ph.agila
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.3.2"
    CURRENT_PROJECT_VERSION: "6"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      APNS_ENVIRONMENT: development
    Release:
      APNS_ENVIRONMENT: production
targets:
  AGILA:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ph.agila.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AGILA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: ph.agila.alert
            CFBundleURLSchemes: [agila]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: AgilaMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [remote-notification, location]
        NSSupportsLiveActivities: true
        AGILACriticalAlertsApproved: false
        NSLocationWhenInUseUsageDescription: "Share your position with approved command-center operators while you are on duty."
        NSCameraUsageDescription: "Take a photo you choose to attach to your assigned incident chat."
        NSPhotoLibraryUsageDescription: "Select a photo to share privately with dispatch for your assigned incident."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Continue sending your position during duty when the screen is locked or another app is open. End duty stops sharing."
    entitlements:
      path: App/AGILA.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - target: AGILAAlerts
    scheme:
      testTargets: [AGILATests, AGILAUITests]
  AGILAAlerts:
    type: app-extension
    platform: iOS
    sources: [LiveActivity, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ph.agila.app.alerts
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: AGILA Alerts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AGILATests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AGILA
  AGILAUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AGILA
