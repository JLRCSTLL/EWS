# Free deployment is for evaluation. Render free Postgres expires after 30 days.
services:
  - type: web
    name: e-ligtas
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: e-ligtas-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://ews-kappa.vercel.app
      - key: PUBLIC_APP_URL
        value: https://ews-kappa.vercel.app
      - key: BOOTSTRAP_TOKEN
        generateValue: true
databases:
  - name: e-ligtas-db
    region: singapore
    plan: free
    databaseName: eligtas
    user: eligtas
    ipAllowList: []
